name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The same lint, test, vulnerability and cross-build checks a pull request
  # gets, run against the tagged tree. A release is not cut from something
  # that was never checked.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      # Only this job creates anything, and only this job gets write.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The changelog diffs against the previous tag, which is not in a
          # shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      # Everything this used to do by hand (build the matrix, stamp the tag,
      # checksum, create the release) now lives in .goreleaser.yaml, which
      # also builds the deb and rpm that the shell loop never could.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
