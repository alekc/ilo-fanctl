name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The same lint, test, vulnerability and cross-build checks a pull request
  # gets, run against the tagged tree. A release is not cut from something
  # that was never checked.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      # Only this job creates anything, and only this job gets write.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The generated notes diff against the previous tag, which is not
          # in a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      # Rebuilt rather than pulled from the ci job's artifacts, because those
      # are stamped with the commit SHA and a released binary should report
      # the tag when asked for -version.
      - name: build every target
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0
            out="dist/ilo-fanctl-${GOOS}-${GOARCH}"
            go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "${out}" ./cmd/ilo-fanctl
          done
          ( cd dist && sha256sum ilo-fanctl-* > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "${GITHUB_REF_NAME}" --generate-notes --verify-tag)
          # A hyphen in the tag means v1.2.0-rc1 and friends, which should not
          # show up as the latest release.
          case "${GITHUB_REF_NAME}" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}" \
            dist/ilo-fanctl-* dist/SHA256SUMS
